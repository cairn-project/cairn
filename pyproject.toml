[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# NOTE: "cairn" is the final, owner-ratified project name (mission-neutral by
# design). This closes what was formerly tracked as PLAN.md open decision #9.
name = "cairn"
version = "0.1.0"
description = "Distributed cause-coordination engine (Layer A) — a mission-neutral, model-agnostic distributed detection-and-analysis engine with cross-model verification, human-in-the-loop vetting, and a tamper-evident transparency log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luke Ivers" }]
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cairn = "cairn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.hatch.build.targets.wheel.force-include]
"src/cairn/spec/work_unit.schema.json" = "cairn/spec/work_unit.schema.json"
"src/cairn/spec/SPEC.md" = "cairn/spec/SPEC.md"
"src/cairn/fixtures/benign_pilot.json" = "cairn/fixtures/benign_pilot.json"
"src/cairn/fixtures/cause_threaded.json" = "cairn/fixtures/cause_threaded.json"
"src/cairn/fixtures/structured_acceptance.json" = "cairn/fixtures/structured_acceptance.json"
"src/cairn/fixtures/pilot_license_snippets.json" = "cairn/fixtures/pilot_license_snippets.json"
"src/cairn/fixtures/cause_draft_benign.json" = "cairn/fixtures/cause_draft_benign.json"
"src/cairn/fixtures/capture_target_benign.json" = "cairn/fixtures/capture_target_benign.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
