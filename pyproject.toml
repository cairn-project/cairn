[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# NOTE: "cairn" is a PLACEHOLDER name (PLAN.md open decision #9). The real,
# mission-neutral project name is an open owner decision. Rename touches only the
# package path and import root; nothing else hard-codes the name.
name = "cairn"
version = "0.1.0"
description = "Distributed cause-coordination engine (Layer A) — wave-1 foundation: the work-unit + acceptance-contract spec."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "Luke Ivers" }]
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cairn = "cairn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.hatch.build.targets.wheel.force-include]
"src/cairn/spec/work_unit.schema.json" = "cairn/spec/work_unit.schema.json"
"src/cairn/spec/SPEC.md" = "cairn/spec/SPEC.md"
"src/cairn/fixtures/benign_pilot.json" = "cairn/fixtures/benign_pilot.json"
"src/cairn/fixtures/cause_threaded.json" = "cairn/fixtures/cause_threaded.json"
"src/cairn/fixtures/structured_acceptance.json" = "cairn/fixtures/structured_acceptance.json"
"src/cairn/fixtures/pilot_license_snippets.json" = "cairn/fixtures/pilot_license_snippets.json"
"src/cairn/fixtures/cause_draft_benign.json" = "cairn/fixtures/cause_draft_benign.json"
"src/cairn/fixtures/capture_target_benign.json" = "cairn/fixtures/capture_target_benign.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
