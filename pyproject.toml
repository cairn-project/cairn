[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# "cairn" is mission-neutral by design — the engine is general and multi-cause.
name = "cairn"
version = "0.3.1"
description = "Cause-coordination engine (Layer A) built to be distributed — a mission-neutral, model-agnostic detection-and-analysis engine, aiming for a decentralized volunteer network, with cross-model verification, human-in-the-loop vetting, and a tamper-evident transparency log (single-operator offline pilot today; distributed deployment is a deferred phase)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luke Ivers" }]
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "mypy>=1.10",
]

[project.scripts]
cairn = "cairn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.hatch.build.targets.wheel.force-include]
"src/cairn/spec/work_unit.schema.json" = "cairn/spec/work_unit.schema.json"
"src/cairn/spec/SPEC.md" = "cairn/spec/SPEC.md"
"src/cairn/fixtures/benign_pilot.json" = "cairn/fixtures/benign_pilot.json"
"src/cairn/fixtures/cause_threaded.json" = "cairn/fixtures/cause_threaded.json"
"src/cairn/fixtures/structured_acceptance.json" = "cairn/fixtures/structured_acceptance.json"
"src/cairn/fixtures/pilot_license_snippets.json" = "cairn/fixtures/pilot_license_snippets.json"
"src/cairn/fixtures/cause_draft_benign.json" = "cairn/fixtures/cause_draft_benign.json"
"src/cairn/fixtures/capture_target_benign.json" = "cairn/fixtures/capture_target_benign.json"
"src/cairn/fixtures/scenario_open_data_feeds.json" = "cairn/fixtures/scenario_open_data_feeds.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
# Target the repo's minimum supported Python (see requires-python above).
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["cairn"]

[tool.mypy]
# Type-check the library source (the package surface reviewers depend on). Tests
# stay out of scope for this first adoption — they lean on pytest fixtures whose
# dynamic typing would add noise without checking the shipped API.
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
